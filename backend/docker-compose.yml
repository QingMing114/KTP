services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-remote-sensing-multi-agent}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-18080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/remote_sensing}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TEMPORAL_SERVER_URL: ${TEMPORAL_SERVER_URL:-localhost:7233}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_REGISTRY_URL: ${MODEL_REGISTRY_URL:-http://localhost:9000}
    ports:
      - "${APP_PORT:-18080}:${APP_PORT:-18080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - apps.api_gateway.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${APP_PORT:-18080}"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_sensing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-remote_sensing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
